<!-- Herede -->
{% extends './template-teacher.html' %}

{% block body %}
<div class="container-fluid">
    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Hola Docente {{ user.full_name }} !</h1>
    </div>

    <!-- Mostrar mensajes flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="row">
                <div class="col-12">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endif %}
    {% endwith %}

    <!-- Formulario Docente -->
    <div class="row justify-content-center">
        <div>
            <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <form action="{{ url_for('update_profile_teacher') }}" method="POST">
                        <div class="row">
                            <div class="col-xl-6 col-md-12 mb-3 form-floating">
                                <input type="text" class="form-control" id="code" name="code" value="{{ user.code }}" readonly placeholder="Código">
                                <label class="pl-4" for="code">Código</label>
                            </div>
                            <div class="col-xl-6 col-md-12 mb-3 form-floating">
                                <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required placeholder="Nombre Completo">
                                <label class="pl-4" for="full_name">Nombre Completo</label>
                            </div>
                            <div class="col-xl-6 col-md-12 mb-3 form-floating">
                                <select class="form-control" id="gender" name="gender" required>
                                    <option value="male" {% if user.gender == 'male' %}selected{% endif %}>Masculino</option>
                                    <option value="female" {% if user.gender == 'female' %}selected{% endif %}>Femenino</option>
                                    <option value="other" {% if user.gender == 'other' %}selected{% endif %}>Otro</option>
                                </select>
                                <label class="pl-4" for="gender">Género</label>
                            </div>
                            <div class="col-xl-6 col-md-12 mb-3 form-floating">
                                <select class="form-control" id="civil_status" name="civil_status">
                                    <option value="single" {% if user.civil_status == 'SOLTERO' %}selected{% endif %}>Soltero</option>
                                    <option value="married" {% if user.civil_status == 'CASADO' %}selected{% endif %}>Casado</option>
                                    <option value="widowed" {% if user.civil_status == 'VIUDO' %}selected{% endif %}>Viudo</option>
                                    <option value="divorced" {% if user.civil_status == 'DIVORCIADO' %}selected{% endif %}>Divorciado</option>
                                    <option value="other" {% if user.civil_status == 'other' %}selected{% endif %}>Otro</option>
                                </select>
                                <label class="pl-4" for="civil_status">Estado Civil</label>
                            </div>
                            <div class="col-xl-6 col-md-12 mb-3 form-floating">
                                <input type="email" class="form-control" id="institutional_mail" name="institutional_mail" value="{{ user.institutional_mail }}" readonly placeholder="Correo Institucional">
                                <label class="pl-4" for="institutional_mail">Correo Institucional</label>
                            </div>
                            <div class="col-xl-6 col-md-12 mb-3 form-floating">
                                <input type="email" class="form-control" id="personal_mail" name="personal_mail" value="{{ user.personal_mail }}" placeholder="Correo Personal">
                                <label class="pl-4" for="personal_mail">Correo Personal</label>
                            </div>
                            <div class="col-xl-6 col-md-12 mb-3 form-floating">
                                <input type="text" class="form-control" id="phone" name="phone" value="{{ user.phone }}" placeholder="Teléfono">
                                <label class="pl-4" for="phone">Teléfono</label>
                            </div>
                            <div class="col-xl-6 col-md-12 mb-3 form-floating">
                                <input type="text" class="form-control" id="role" name="role" value="{% if user.role_id == 1 %}Docente{% elif user.role_id == 2 %}Estudiante{% else %}Desconocido{% endif %}" readonly placeholder="Rol">
                                <label class="pl-4" for="role">Rol</label>
                            </div>
                            <div class="col-xl-6 col-md-12 mb-3 form-floating">
                                <input type="text" class="form-control" id="campus" name="campus" value="{{ user.campus }}" readonly placeholder="Campus">
                                <label class="pl-4" for="campus">Campus</label>
                            </div>
                            <div class="col-12 d-flex justify-content-center mt-3">
                                <button class="btn btn-warning" type="submit">Editar Datos</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
